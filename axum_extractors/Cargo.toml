[package]
name = "axum_extractors"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
ciborium = "0.2.2"
cookie = { version = "0.18.1", features = ["percent-encode", "secure"] }
ed25519-dalek = "2.2.0"
mime = "0.3.17"
problem_details = { version = "0.9.0", default-features = false }
serde = "1.0.228"
signed_data = { version = "0.1.0", path = "../signed_data" }
simple_deref = { version = "0.1.0", path = "../simple_deref" }
thiserror = "2.0.18"
time = "0.3.47"
tracing = "0.1.44"

[lints]
workspace = true
